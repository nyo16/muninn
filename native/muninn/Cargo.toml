[package]
name = "muninn"
version = "0.5.3"
edition = "2021"

[lib]
name = "muninn"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37.0"
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "51f340f83d06680fc2e231481fa10115f3bc2b7b" }
regex = "1.11"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]

[profile.release]
lto = true
opt-level = 3
