[package]
name = "muninn"
version = "0.5.4"
edition = "2021"

[lib]
name = "muninn"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37.0"
tantivy = "0.26.0"
regex = "1.11"
serde_json = "1"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]

[profile.release]
lto = true
opt-level = 3
